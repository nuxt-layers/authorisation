version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A new release must age before it is proposed; most malicious releases are
    # pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Major versions the current Nuxt cannot use. Remove each rule when Nuxt can.
    ignore:
      # nuxt typecheck and vue-tsc need TypeScript's JavaScript API, which 7.x
      # does not have; the development baseline is 6.0.3 (ADR-0013).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Nuxt 4 runs on Nitro 2, which bundles h3 1.x. The h3 here exists so the
      # unit tests run the same major version as a built host.
      - dependency-name: h3
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
